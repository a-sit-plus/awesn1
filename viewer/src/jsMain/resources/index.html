<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>awesn1 viewer</title>
  <style>
    :root { font: 16px system-ui, sans-serif; color-scheme: light dark; }
    body { margin: 2rem 0; padding: 0 1rem; }
    textarea, pre, select, button { font: .95rem ui-monospace, monospace; }
    textarea { width: 100%; min-height: 12rem; box-sizing: border-box; }
    .controls { display: flex; gap: .5rem; margin: .75rem 0; flex-wrap: wrap; }
    pre { white-space: pre-wrap; overflow: auto; max-height: 65vh; }
    #status { min-height: 1.5em; }
    #hex-output { white-space: pre; }
    .primary-output { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1.5rem; }
    .primary-output > section { min-width: 0; }
    @media (max-width: 800px) { .primary-output { grid-template-columns: 1fr; } }
    .hex-tag { color: #e05252; font-weight: 700; }
    .hex-length { color: #9b59b6; font-weight: 700; }
    .hex-value-0 { color: #2878b5; }
    .hex-value-1 { color: #16856b; }
    .hex-value-2 { color: #b06c00; }
    .hex-value-3 { color: #b33b80; }
    .hex-value-4 { color: #4f6bed; }
    .hex-value-5 { color: #668000; }
    .asn1-highlight { background: #ffe08a; border-radius: 2px; }
    @media (prefers-color-scheme: dark) { .asn1-highlight { background: #654f00; } }
  </style>
</head>
<body>
  <h1>awesn1 ASN.1 viewer</h1>
  <textarea id="input" spellcheck="false" placeholder="Paste PEM, Base64, or hexadecimal DER here"></textarea>
  <div class="controls">
    <label>Format <select id="format"><option>Auto</option><option>PEM</option><option>Base64</option><option>Hex</option></select></label>
    <button id="decode" type="button">Decode</button>
    <button id="clear" type="button">Clear</button>
  </div>
  <div id="status" role="status"></div>
  <div class="primary-output">
    <section>
      <h2>Typed crypto interpretation</h2>
      <pre id="crypto-output"></pre>
    </section>
    <section>
      <h2>DER hex</h2>
      <p><span class="hex-tag">tag</span> · <span class="hex-length">length</span> · values colored by nesting level</p>
      <pre id="hex-output"></pre>
    </section>
  </div>
  <section>
    <h2>Generic ASN.1</h2>
    <pre id="output"></pre>
  </section>
  <script src="viewer.js"></script>
</body>
</html>
